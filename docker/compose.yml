services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the env file}
      MARIADB_DATABASE: fineract_tenants
      MARIADB_USER: fineract
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the env file}
    volumes:
      - database:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../fineract-db/server_collation.cnf:/etc/mysql/conf.d/server_collation.cnf:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ..
      target: production
    image: ${API_IMAGE:-score-management-api}:${IMAGE_TAG:-local}
    init: true
    environment:
      FINERACT_NODE_ID: 1
      FINERACT_SERVER_PORT: 8080
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.mariadb.jdbc.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:mariadb://db:3306/fineract_tenants
      FINERACT_HIKARI_USERNAME: fineract
      FINERACT_HIKARI_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the env file}
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: 3306
      FINERACT_DEFAULT_TENANTDB_UID: fineract
      FINERACT_DEFAULT_TENANTDB_PWD: ${DB_PASSWORD:?Set DB_PASSWORD in the env file}
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: ${TENANT_TIMEZONE:-Asia/Bangkok}
      JAVA_TOOL_OPTIONS: >-
        -Xmx${API_HEAP:-2g} -Duser.home=/data -Duser.timezone=UTC -Dfile.encoding=UTF-8
        --add-exports=java.naming/com.sun.jndi.ldap=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.security=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.management/javax.management=ALL-UNNAMED
        --add-opens=java.naming/javax.naming=ALL-UNNAMED
    volumes:
      - documents:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/fineract-provider/actuator/health]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    stop_grace_period: 60s

  frontend:
    build:
      context: ${FRONTEND_PATH:-../../Score-Management-System-Frontend}
      target: production
    image: ${FRONTEND_IMAGE:-score-management-frontend}:${IMAGE_TAG:-local}
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      api:
        condition: service_healthy

volumes:
  database:
  documents:
